name: "Test Client and Server"

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    server:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]
                
        defaults:
            run:
                working-directory: "PocketPad Server"

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install -r requirements-dev.txt

            - run: sudo apt update && sudo apt install -y libegl1-mesa-dev
              if: matrix.os == 'ubuntu-latest'

            - name: Run server tests
              run: pytest server_app_testing.py -vv -s
    client:
        runs-on: [self-hosted, macOS, ARM64]

        defaults:
            run:
                working-directory: "PocketPad Client"

        steps:
            - uses: actions/checkout@v4
              
            - name: List available Xcode versions
              run: ls /Applications | grep Xcode

            - run: xcodebuild -version

            - name: Run tests
              run: |
                set -o pipefail && xcodebuild test -scheme "PocketPad ClientTests" -destination 'platform=iOS Simulator,name=iPhone 16 Plus,OS=18.2' -resultBundlePath ClientTests.xcresult | xcbeautify --renderer github-actions

            - name: Run UI tests
              run: |
                set -o pipefail && xcodebuild -scheme "PocketPad ClientUITests" -destination 'platform=iOS Simulator,name=iPhone 16 Plus,OS=18.2' -parallel-testing-worker-count 3 test -resultBundlePath ClientUITests.xcresult | xcbeautify --renderer github-actions
                
            - name: Upload xcresults
              uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                name: results
                path: |
                  ${{ github.workspace }}/PocketPad Client/*.xcresults
